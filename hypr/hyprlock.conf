# hyprlock — Catppuccin Frappé, matched to Waybar rice

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
    disable_loading_bar = false
}

background {
    monitor =
    color = rgba(48, 52, 70, 1.0)   # frappe base #303446
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.17
}

# ── clock ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M:%S')"
    color = rgba(198, 208, 245, 1.0)   # frappe text
    font_size = 90
    font_family = FiraCode Nerd Font
    position = 0, 160
    halign = center
    valign = center
}

# ── date ──
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(165, 173, 206, 1.0)   # frappe subtext0
    font_size = 22
    font_family = FiraCode Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# ── password input ──
input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(231, 130, 132, 1.0)   # maroon accent #e78284
    inner_color = rgba(41, 44, 60, 1.0)      # frappe mantle
    font_color = rgba(198, 208, 245, 1.0)
    fade_on_empty = false
    placeholder_text = <i>password…</i>
    hide_input = false
    check_color = rgba(166, 209, 137, 1.0)   # green on verify
    fail_color = rgba(231, 130, 132, 1.0)    # maroon on fail
    fail_text = <i>wrong — try again</i>
    position = 0, -60
    halign = center
    valign = center
}

# ── user hint ──
label {
    monitor =
    text =   $USER
    color = rgba(140, 170, 238, 1.0)   # frappe blue
    font_size = 16
    font_family = FiraCode Nerd Font
    position = 0, -140
    halign = center
    valign = center
}
