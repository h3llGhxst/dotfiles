# hypridle — auto-lock and power management

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid stacking lockers
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on   # wake screen on resume
}

# Warn by dimming the screen at 4.5 min
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 10%        # save current, dim
    on-resume = brightnessctl -r                 # restore on activity
}

# Lock at 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off at 6 min
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend at 15 min
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
